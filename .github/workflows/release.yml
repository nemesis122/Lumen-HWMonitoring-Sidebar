name: Build and publish release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['Directory.Build.props']

permissions:
  contents: write

concurrency:
  group: lumen-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") { throw 'Tag/version mismatch' }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Test repository
        run: dotnet test tests/Lumen.Tests -c Release -m:1
      - name: Test extended layout and data regressions
        run: dotnet run --project tools/Lumen.Regression -c Release -p:BuildInParallel=false -- --expect-fixed
      - name: Verify design gallery
        shell: pwsh
        run: |
          $images = Get-ChildItem docs/images/v4.0.0/gallery-*.png
          if ($images.Count -lt 15) { throw 'Incomplete design gallery' }
      - name: Publish portable Windows executable
        run: dotnet publish src/Lumen.App -c Release -r win-x64 --self-contained -m:1 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish
      - name: Package release assets
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force out, portable | Out-Null
          Copy-Item publish/Lumen.exe "out/Lumen-$v.exe"
          Copy-Item publish/Lumen.exe portable/Lumen.exe
          Copy-Item LICENSE portable/LICENSE
          Copy-Item licenses portable/licenses -Recurse
          Compress-Archive -Path portable/* -DestinationPath "out/Lumen-$v-Portable.zip"
          git archive --format=zip -o "out/Lumen-$v-Source.zip" HEAD
          Compress-Archive -Path docs/images/* -DestinationPath "out/Lumen-$v-Screenshots.zip"
          Get-FileHash out/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content out/SHA256SUMS.txt
      - name: Publish Lumen release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $notes = "docs/release-notes/v$v.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          $title = (Get-Content $notes -First 1) -replace '^#\s*', ''
          if (gh release view "v$v" 2>$null) {
            gh release upload "v$v" out/* --clobber
            gh release edit "v$v" --title "$title" --notes-file $notes --draft=false --prerelease=false --latest
          } else {
            gh release create "v$v" out/* --target "$env:GITHUB_SHA" --title "$title" --notes-file $notes --latest
          }

