name: Remove old releases

# Started by hand (Actions → Remove old releases → Run workflow). Deletes every release and its
# tag except the version in Directory.Build.props, so only the current release stays.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove all releases except the current one'
        required: true

permissions:
  contents: write

jobs:
  remove:
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove all but the current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="v$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)"
          echo "Keeping $keep"
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ "$tag" != "$keep" ]; then
              echo "Removing $tag"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
